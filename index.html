<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/expert-landing/favicon.svg" />
    <!-- Safari и старые браузеры SVG-иконку не берут, iOS для «Домой» — только PNG -->
    <link rel="icon" href="/expert-landing/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/expert-landing/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- iOS превращал ИНН и прочие цифры в ссылки-звонки; явные tel: работают и так -->
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="ЭКСПЕРТ — профессиональные клеи для паркета: пять формул от эластичного до жёсткого и полиуретановый грунт-праймер. Станьте дилером ЭКСПЕРТ в своём регионе."
    />
    <meta name="theme-color" content="#16130f" />
    <!-- Постер hero ставится фоном только после монтирования React — без preload
         на медленной сети 1–2 с пустой тёмной сцены. Условие — как у vertical в Hero -->
    <link
      rel="preload"
      as="image"
      href="/expert-landing/assets/hero/poster-m.jpg"
      media="(orientation: portrait) and (pointer: coarse)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/expert-landing/assets/hero/poster.jpg"
      media="not all and (orientation: portrait) and (pointer: coarse)"
      fetchpriority="high"
    />
    <!-- Превью ссылки в мессенджерах: финальный кадр с паркетом, не постер (на нём этикетка).
         URL абсолютный — после переезда на поддомен caspol.ru поменять здесь и в og:url -->

    <meta property="og:site_name" content="ЭКСПЕРТ" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://andrewmironov13.github.io/expert-landing/" />
    <meta property="og:title" content="ЭКСПЕРТ — профессиональные клеи для паркета" />
    <meta
      property="og:description"

    />
